name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:20

    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: npm install -g htmlhint@^1 stylelint@^16 stylelint-config-standard@^38

      - name: Run HTMLHint
        run: htmlhint index.html

      - name: Run stylelint
        run: stylelint style.css